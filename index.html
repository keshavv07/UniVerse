<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>UniVerse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles/style.css">
</head>

<body>

  <h1>UniVerse</h1>

  <div class="searchBox">
    <input type="text" id="country" placeholder="Enter country name">
    <button onclick="handleSearch()">Search</button>
    <button onclick="toggleDarkMode()" id="darkBtn">🌙 Dark Mode</button>
  </div>

  <div class="controls" id="controls" style="display:none;">
    <input type="text" id="nameSearch" placeholder="Search by name...">

    <div class="filterButtons">
      <button data-filter="all">All</button>
      <button data-filter="technology">Technology</button>
      <button data-filter="engineering">Engineering</button>
    </div>

    <select id="sortOrder">
      <option value="">Sort by name...</option>
      <option value="az">A → Z</option>
      <option value="za">Z → A</option>
    </select>
  </div>

  <div id="container"></div>

  <script src="./scripts/app.js"></script>

</body>

</html>
